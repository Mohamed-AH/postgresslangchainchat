name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Ruff (format)
        run: ruff format --check src tests

      - name: Mypy (type check)
        run: mypy

      - name: Pytest
        # The suite runs with no API keys and no live database (embeddings/LLM/pgvector
        # are faked; the relational layer runs on SQLite in-memory).
        run: pytest --cov=ragchat --cov-report=term-missing
